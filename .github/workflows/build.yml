name: Build Hermes runtime-footer image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches: [main]
    paths:
      - "**"

permissions:
  contents: read
  packages: write

concurrency:
  group: hermes-runtime-footer-image
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run patch and deployment contract tests
        run: python3 -m unittest discover -s tests -v

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish verified derived image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-runtime-footer-public:latest
            ghcr.io/${{ github.repository_owner }}/hermes-runtime-footer-public:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
